name: Android CI

on:
  push:
  workflow_dispatch:   # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use the runner's preinstalled Android SDK (default JDK 17 is active here,
      # which the modern sdkmanager requires) to add the exact old components
      # this AGP 3.5.0 project needs.
      - name: Install platform-29 + build-tools 29.0.2
        run: |
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-29" "build-tools;29.0.2"

      # Gradle 5.4.1 / AGP 3.5.0 require JDK 8 — switch only after the SDK step.
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build debug + release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: wget-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
