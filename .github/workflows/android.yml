name: Android CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # allow pushing built APKs to the ci-apks branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install platform-29 + build-tools 29.0.2
        run: |
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-29" "build-tools;29.0.2"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build debug + release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APKs (browser-downloadable artifact)
        uses: actions/upload-artifact@v4
        with:
          name: wget-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish APKs to ci-apks branch
        run: |
          mkdir -p /tmp/apks
          find app/build/outputs/apk -name '*.apk' -exec cp {} /tmp/apks/ \;
          ls -la /tmp/apks
          cd /tmp/apks
          git init -q
          git checkout -q -b ci-apks
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -q -m "APKs from run ${{ github.run_id }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-apks
