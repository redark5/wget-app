name: Android CI

on:
  push:
  workflow_dispatch:   # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SDK first, while the runner's default JDK (17) is active —
      # the modern sdkmanager needs JDK 11+ to run.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform-29 + build-tools 29.0.2
        run: sdkmanager "platforms;android-29" "build-tools;29.0.2"

      # Gradle 5.4.1 / AGP 3.5.0 require JDK 8 — switch only now.
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build debug + release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: wget-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
